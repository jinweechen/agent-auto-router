name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Verify orchestrated dry run
        shell: pwsh
        run: |
          & './skills/agent-auto-router/scripts/invoke_orchestrated_task.ps1' `
            -Task 'Implement API and tests for independent modules' `
            -Strategy balance -Workdir '.' -DryRun
      - name: Verify repeatable skill installation
        shell: pwsh
        run: |
          $homePath = Join-Path $env:RUNNER_TEMP 'codex-home'
          & './skills/agent-auto-router/scripts/install.ps1' -CodexHome $homePath
          & './skills/agent-auto-router/scripts/install.ps1' -CodexHome $homePath
          $nested = Join-Path $homePath 'skills/agent-auto-router/agent-auto-router'
          if (Test-Path -LiteralPath $nested) { throw "Nested skill directory detected: $nested" }
